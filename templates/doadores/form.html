{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if doador else 'Novo' }} Doador{% endblock %}

{% block conteudo %}
  <h1 class="h3 mb-3">{{ 'Editar' if doador else 'Novo' }} doador</h1>

  <form method="POST" class="bg-white p-4 rounded shadow-sm">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome *</label>
        <input type="text" name="nome" class="form-control" required value="{{ doador.nome if doador else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">CPF/CNPJ</label>
        <input type="text" name="cpf_cnpj" class="form-control" value="{{ doador.cpf_cnpj if doador else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control" value="{{ doador.telefone if doador else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ doador.email if doador else '' }}">
      </div>
    </div>
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a href="{{ url_for('listar_doadores') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
{% endblock %}
