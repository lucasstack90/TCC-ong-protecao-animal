{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if adotante else 'Novo' }} Adotante{% endblock %}

{% block conteudo %}
  <h1 class="h3 mb-3">{{ 'Editar' if adotante else 'Novo' }} adotante</h1>

  <form method="POST" class="bg-white p-4 rounded shadow-sm">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome *</label>
        <input type="text" name="nome" class="form-control" required value="{{ adotante.nome if adotante else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">CPF</label>
        <input type="text" name="cpf" class="form-control" value="{{ adotante.cpf if adotante else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control" value="{{ adotante.telefone if adotante else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ adotante.email if adotante else '' }}">
      </div>
      <div class="col-md-12">
        <label class="form-label">Endereço</label>
        <input type="text" name="endereco" class="form-control" value="{{ adotante.endereco if adotante else '' }}">
      </div>
    </div>
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a href="{{ url_for('listar_adotantes') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
{% endblock %}
